/* ---------- IndexedDB 封装 ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('progress')) {
        const s = d.createObjectStore('progress', { keyPath: 'word' });
        s.createIndex('nextReviewDate', 'nextReviewDate');
        s.createIndex('stage', 'stage');
      }
      if (!d.objectStoreNames.contains('stats')) d.createObjectStore('stats', { keyPath: 'date' });
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function store(name, mode) { return db.transaction(name, mode).objectStore(name); }
function getAll(name) {
  return new Promise((res, rej) => {
    const r = store(name, 'readonly').getAll();
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function get(name, key) {
  return new Promise((res, rej) => {
    const r = store(name, 'readonly').get(key);
    r.onsuccess = () => res(r.result || null);
    r.onerror = () => rej(r.error);
  });
}
function put(name, val) {
  return new Promise((res, rej) => {
    const r = store(name, 'readwrite').put(val);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function del(name, key) {
  return new Promise((res, rej) => {
    const r = store(name, 'readwrite').delete(key);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
async function getSetting(key) { const s = await get('settings', key); return s ? s.value : null; }
async function setSetting(key, value) { await put('settings', { key, value, updatedAt: Date.now() }); }

/* ---------- 日期 / 通用工具 ---------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayISO() { return toISO(new Date()); }
function addDaysISO(iso, days) {
  const p = iso.split('-');
  const d = new Date(+p[0], +p[1] - 1, +p[2]);
  d.setDate(d.getDate() + days);
  return toISO(d);
}
function daysBetween(a, b) {
  const pa = a.split('-'), pb = b.split('-');
  const da = new Date(+pa[0], +pa[1] - 1, +pa[2]);
  const db = new Date(+pb[0], +pb[1] - 1, +pb[2]);
  return Math.round((db - da) / 86400000);
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

function getExamples(word) {

}
function exHTML(word) {

}

/* ---------- "不熟悉"词池：标记后次日加入复习 ---------- */
async function getUnfamiliar() {
  const raw = await getSetting(UNFAMILIAR_KEY);
  try { const a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
async function setUnfamiliar(list) { await setSetting(UNFAMILIAR_KEY, JSON.stringify(list)); }
async function isUnfamiliar(word) { const l = await getUnfamiliar(); return l.some(u => u.w === word); }
async function addUnfamiliar(word) {
  const l = await getUnfamiliar();
  if (!l.some(u => u.w === word)) { l.push({ w: word, t: todayISO() }); await setUnfamiliar(l); return true; }
  return false;
}
async function removeUnfamiliar(word) {
  const l = await getUnfamiliar();
  const n = l.filter(u => u.w !== word);
  if (n.length !== l.length) { await setUnfamiliar(n); return true; }
  return false;
}
/* ============ 朗读 ============
   优先用"网易词典在线发音"（联网、发音标准、手机上任何浏览器都能出声），
   不依赖手机自带的语音包（很多国产手机没有英语语音，系统朗读会无声）。
   在线发音失败（断网 / 被拦截）时退回浏览器自带 speechSynthesis。 */
let audioEl = null;
function ensureAudio() {
  if (!audioEl) {
    audioEl = new Audio();
    audioEl.preload = 'auto';
  }
  return audioEl;
}
function speakViaSynth(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    const synth = window.speechSynthesis;
    synth.cancel();
    if (synth.paused) synth.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    synth.speak(u);
  } catch (e) { /* ignore */ }
}
function speak(text) {
  const word = String(text || '').trim();
  if (!word) return;
  // 主方案：网易词典发音（美音），打开卡片自动读 / 点卡片重读都走这里
  const url = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2';
  try {
    const a = ensureAudio();
    a.muted = false;
    a.onerror = () => speakViaSynth(word);
    a.src = url;
    const p = a.play();
    if (p && p.catch) p.catch(() => speakViaSynth(word));
  } catch (e) {
    speakViaSynth(word);
  }
}

// 手机浏览器限制：页面必须先收到一次用户触摸/点击，才允许"自动"发声（含自动朗读）。
// 首次点击时静默播放一次，解锁音频通道（iOS 尤其需要），之后打开卡片即可自动读。
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const a = ensureAudio();
    a.muted = true;
    a.src = 'https://dict.youdao.com/dictvoice?audio=ok&type=2';
    a.play().catch(() => {});
  } catch (e) { /* ignore */ }
}
let synthUnlocked = false;
function unlockSynth() {
  if (synthUnlocked || !('speechSynthesis' in window)) return;
  synthUnlocked = true;
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    if (synth.paused) synth.resume();
  } catch (e) { /* ignore */ }
}
document.addEventListener('touchstart', unlockAudio, { passive: true, once: true });
document.addEventListener('click', () => { unlockAudio(); unlockSynth(); }, { once: true });

/* ---------- 进度模型 ---------- */
function buildProgress(w) {
  const info = WORD_MAP[w.word] || {};
  return {
    word: w.word, list: info.list != null ? info.list : 0,
    stage: 0, nextReviewDate: null,
    rightCount: 0, wrongCount: 0,
    lastReviewDate: null, learnedDate: null,
    favorite: false, reviews: [],
    updatedAt: Date.now()
  };
}
async function getOrCreateProgress(w) { const p = await get('progress', w.word); return p || buildProgress(w); }

// 计算下一个待学的 List 下标（第一个尚有 stage<1 单词的 List）；全部学完返回 RAW_WORDS.length
async function computeLearnedIndex() {
  const progs = await getAll('progress');
  const map = {}; progs.forEach(p => { map[p.word] = p; });
  for (let i = 0; i < RAW_WORDS.length; i++) {
    const any = RAW_WORDS[i].words.some(w => { const p = map[w.word]; return !p || p.stage < 1; });
    if (any) return i;
  }
  return RAW_WORDS.length;
}
// 每天一个 List：检查 listIndex 这个 List 是否今天刚学完（全部词 learnedDate == 今天）
async function listDoneToday(listIndex) {
  if (listIndex < 0 || listIndex >= RAW_WORDS.length) return false;
  const progs = await getAll('progress');
  const map = {}; progs.forEach(p => { map[p.word] = p; });
  const t = todayISO();
  return RAW_WORDS[listIndex].words.every(w => { const p = map[w.word]; return !!p && p.learnedDate === t; });
}
// 今日待复习：stage>=1 且到期
async function getReviewQueue() {
  const progs = await getAll('progress');
  const t = todayISO();
  const items = progs.filter(p => p.stage >= 1 && p.nextReviewDate && p.nextReviewDate <= t)
              .sort((a, b) => a.nextReviewDate < b.nextReviewDate ? -1 : 1)
              .map(p => ({ prog: p, extra: false }));
  // 并入"不熟悉"词池中已到期（当天标记的次日才开始）的词，不影响其学习进度
  const unfam = await getUnfamiliar();
  for (const u of unfam) {
    if (u.t && u.t >= t) continue; // 当天标记 → 明天才开始复习
    if (items.some(it => it.prog.word === u.w)) continue;
    const w = WORD_MAP[u.w];
    let p = await get('progress', u.w);
    if (!p) p = buildProgress({ word: u.w, list: w ? w.list : 0 });
    items.push({ prog: p, extra: true });
  }
  return items;
}
// 每日统计
async function recordDailyStats(newCount, reviewCount, correct, total) {
  const date = todayISO();
  const ex = await get('stats', date) || { date, newCount: 0, reviewCount: 0, correct: 0, total: 0, updatedAt: 0 };
  ex.newCount += newCount;
  ex.reviewCount += reviewCount;
  ex.correct += correct;
  ex.total += total;
  ex.updatedAt = Date.now();
  await put('stats', ex);
}

  }).join('');
  el.innerHTML =
    '<div class="page-head"><h1>单词总览</h1><p class="sub">' + RAW_WORDS.length + ' 个 List · ' + ALL_WORDS.length + ' 词 · 点击 List 全屏查看</p></div>' +
    rows;
  el.querySelectorAll('.lst-row').forEach(r => r.addEventListener('click', () => openListDetail(parseInt(r.dataset.list, 10) - 1)));
}

// 全屏查看某个 List 的全部单词，可标记"不熟悉"
async function openListDetail(listIndex) {

  if (!lst) return;
  const unfam = await getUnfamiliar();
  const unfamSet = new Set(unfam.map(u => u.w));
  document.getElementById('listTitle').textContent = 'List ' + (listIndex + 1) + ' · ' + lst.words.length + ' 词';
  const body = document.getElementById('listBody');

function closeListDetail() {

}

/* =====================================================================
   未完成会话：中途退出后保留进度，当天再点回来接着学
   ===================================================================== */
async function savePending(s) {
  if (!s || s.mode !== 'new' || s.phase === 'result') return;
  const answers = {};
  s.queue.forEach(it => { if (it.answered) answers[it.w.word] = { c: !!it.quizCorrect }; });
  await setSetting(PENDING_KEY, JSON.stringify({
    date: todayISO(),
    listIndex: s.listIndex,
    phase: s.phase,
    index: s.index,
    qIndex: s.qIndex || 0,
    correctCount: s.correctCount || 0,
    answers: answers,
    qOrder: s.qOrder,        // 测验乱序顺序（便于中断后接着测）
    recallOrder: s.recallOrder, // 回忆轮顺序
    rIndex: s.rIndex || 0
  }));
}
async function loadPending() {
  const raw = await getSetting(PENDING_KEY);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    return o && o.date === todayISO() ? o : null;
  } catch (e) { return null; }
}
async function clearPending() { await del('settings', PENDING_KEY); }

/* ---------- 复习会话的进度存档（同上，仅当天有效） ---------- */
async function savePendingReview(s) {
  if (!s || s.mode !== 'review' || s.phase === 'result') return;
  const answers = {};
  s.queue.forEach(it => { if (it.answered === true) answers[it.prog.word] = 'y'; else if (it.answered === false) answers[it.prog.word] = 'n'; });
  await setSetting(PENDING_REVIEW_KEY, JSON.stringify({
    date: todayISO(),
    index: s.index,
    correctCount: s.correctCount || 0,
    wrongCount: s.wrongCount || 0,
    answers: answers,
    order: s.queue.map(it => it.prog.word)
  }));
}
async function loadPendingReview() {
  const raw = await getSetting(PENDING_REVIEW_KEY);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    return o && o.date === todayISO() ? o : null;
  } catch (e) { return null; }
}
async function clearPendingReview() { await del('settings', PENDING_REVIEW_KEY); }

/* ---------- 复习结果存档：复习完后首页仍可反复点开"不熟悉单词"，仅当天有效 ---------- */
async function saveLastReviewResult(res) { await setSetting(LAST_REVIEW_KEY, JSON.stringify(res)); }
async function loadLastReviewResult() {
  const raw = await getSetting(LAST_REVIEW_KEY);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (!o || o.date !== todayISO()) return null;
    if (!o.words || !o.words.length) {
      // 旧版存档没有 words：用今天复习过的进度记录还原，保证"再复习一遍"按钮可用
      const progs = await getAll('progress');
      o.words = progs.filter(p => p.lastReviewDate === o.date).map(p => ({ word: p.word, extra: false }));
    }
    return o;
  } catch (e) { return null; }
}

/* =====================================================================
   学新词（stage=0）：浏览 → 测验 → 晋级/重学
   ===================================================================== */
async function startNewSession() {
  const reviewQ = await getReviewQueue();
  if (reviewQ.length) { toast('请先完成今日复习'); return; }
  const idx = await computeLearnedIndex();
  if (idx >= RAW_WORDS.length) { toast('全部 List 已学完'); return; }
  if (idx > 0 && await listDoneToday(idx - 1)) { toast('今日 List 已完成，明天再学下一个'); return; }

  const today = todayISO();
  const buildQueue = async () => {
    const queue = [];
    for (const w of RAW_WORDS[idx].words) {
      const prog = await getOrCreateProgress(w);
      if (prog.stage >= 1) continue;                 // 本 List 已学过的词跳过
      if (!prog.nextReviewDate) { prog.nextReviewDate = today; prog.updatedAt = Date.now(); await put('progress', prog); }
      queue.push({ w: w, prog: prog, quizCorrect: false, answered: false });
    }
    return queue;
  };

  // 同一天、同一个 List 有未完成进度 → 接着学，而不是从头再来
  const pending = await loadPending();
  if (pending && pending.listIndex === idx) {
    const queue = await buildQueue();
    if (!queue.length) { await clearPending(); toast('本 List 已学完'); return; }
    const answers = pending.answers || {};
    queue.forEach(it => { const a = answers[it.w.word]; if (a) { it.answered = true; it.quizCorrect = !!a.c; } });
    // 测验中途退出 → 按当时保存的乱序顺序继续，不重新打乱
    if (pending.phase === 'quiz' && Array.isArray(pending.qOrder) && pending.qOrder.length) {
      queue.sort((a, b) => pending.qOrder.indexOf(a.w.word) - pending.qOrder.indexOf(b.w.word));
    }
    const correctCount = queue.filter(it => it.answered && it.quizCorrect).length;
    const index = Math.min(pending.index || 0, queue.length - 1);
    const qIndex = Math.min(pending.qIndex || 0, queue.length);
    session = { mode: 'new', listIndex: idx, queue: queue, index: index, phase: pending.phase, qIndex: qIndex, correctCount: correctCount, history: [] };
    showSession();
    if (session.phase === 'quiz') {
      let qi = qIndex;
      while (qi < queue.length && queue[qi].answered) qi++; // 跳过已答过的题
      session.qIndex = qi;
      if (qi >= queue.length) startRecall(); else renderQuiz();
    } else if (session.phase === 'recall') {
      const ro = (Array.isArray(pending.recallOrder) && pending.recallOrder.length) ? pending.recallOrder : queue.map(it => it.w.word);
      session.recallQueue = ro.map(word => WORD_MAP[word]).filter(Boolean);
      session.rIndex = Math.min(pending.rIndex || 0, session.recallQueue.length - 1);
      session.recallHistory = [];
      renderRecall();
    } else if (session.phase === 'transition') {
      showTransition(); // 停在过渡页，点击后才开始测验
    } else {
      renderBrowse();
    }
    return;
  }
  if (pending) await clearPending(); // 旧日 / 其他 List 的残留进度，丢弃

  const queue = await buildQueue();
  if (!queue.length) { toast('本 List 已学完'); return; }

  session = { mode: 'new', listIndex: idx, queue: queue, index: 0, phase: 'browse' };
  showSession();
  renderBrowse();
}

function showSession() {
  document.getElementById('sessionView').classList.remove('hidden');
  let title;
  if (session.phase === 'recall') {
    title = (session.mode === 'replay' ? '练习 · List ' : '学习新词 · List ') + (session.listIndex + 1) + ' · 回忆';
  } else if (session.mode === 'new') title = '学习新词 · List ' + (session.listIndex + 1);
  else if (session.mode === 'replay') title = '练习 · List ' + (session.listIndex + 1);
  else if (session.mode === 'missed') title = '不熟悉单词';
  else if (session.mode === 'review-replay') title = '复习巩固 · ' + session.queue.length + ' 词';
  else title = '复习旧词 · ' + session.queue.length + ' 词';
  document.getElementById('sessionTitle').textContent = title;
}

function closeSession() {
  if (session && session.phase !== 'result') {
    if (session.mode === 'new') savePending(session);       // 中途退出：记住进度，下次接着学
    else if (session.mode === 'review') savePendingReview(session);
  }
  clearTimeout(session ? session._t : null);
  session = null;
  document.getElementById('sessionView').classList.add('hidden');
  refreshAll();
}

async function renderBrowse() {
  if (!session) return;
  const item = session.queue[session.index];
  const total = session.queue.length;
  const last = session.index === total - 1;
  const canPrev = session.index > 0;
  const unfamNow = await isUnfamiliar(item.w.word);
  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="progress-row"><span>浏览 ' + (session.index + 1) + ' / ' + total + '</span>' +
      '<div class="bar"><div style="width:' + ((session.index + 1) / total * 100).toFixed(1) + '%"></div></div></div>' +
    '<div class="card big-card" id="scard">' +
      '<button class="star-btn" id="starBtn">' + (item.prog.favorite ? '⭐' : '☆') + '</button>' +
      '<div class="word-big">' + esc(item.w.word) + '</div>' +
      (item.w.phonetic ? '<div class="phonetic">' + esc(item.w.phonetic) + '</div>' : '') +
      '<div class="meaning">' + esc(item.w.meaning) + '</div>' +
      exHTML(item.w.word) +
    '</div>' +
    '<button class="unfam-pill' + (unfamNow ? ' on' : '') + '" id="unfamBtn">' + (unfamNow ? '✓ 已标记' : '不熟悉') + '</button>' +
    '<div class="row2" style="margin-top:14px">' +
      '<button class="btn ghost" id="prevBtn"' + (canPrev ? '' : ' disabled') + '>上一个</button>' +
      '<button class="btn primary" id="nextBtn">' + (last ? '浏览完成' : '下一个') + '</button>' +
    '</div>' +
    '<p class="hint">点击卡片可重新朗读</p>';
  speak(item.w.word);

  document.getElementById('starBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    item.prog.favorite = !item.prog.favorite;
    document.getElementById('starBtn').textContent = item.prog.favorite ? '⭐' : '☆';
    item.prog.updatedAt = Date.now();
    await put('progress', item.prog);
    if (!item.prog.favorite) await removeUnfamiliar(item.w.word); // 取消收藏 → 同步移出"不熟悉"池
    toast(item.prog.favorite ? '已收藏 ⭐' : '已取消收藏');
  });
  document.getElementById('scard').addEventListener('click', () => speak(item.w.word));
  // 浏览时也能标记 / 取消"不熟悉"：标记=加入次日复习+自动收藏；取消=移出池并同步移出收藏
  document.getElementById('unfamBtn').addEventListener('click', async () => {
    const btn = document.getElementById('unfamBtn');
    if (await isUnfamiliar(item.w.word)) {
      await removeUnfamiliar(item.w.word);
      if (item.prog.favorite) { item.prog.favorite = false; item.prog.updatedAt = Date.now(); await put('progress', item.prog); }
      btn.textContent = '不熟悉'; btn.classList.remove('on');
      toast('已取消标记，并移出收藏');
    } else {
      await addUnfamiliar(item.w.word);
      if (!item.prog.favorite) { item.prog.favorite = true; item.prog.updatedAt = Date.now(); await put('progress', item.prog); }
      btn.textContent = '✓ 已标记'; btn.classList.add('on');
      toast('已标记不熟悉，明天复习并已收藏 ⭐');
    }
  });
  document.getElementById('prevBtn').addEventListener('click', () => { if (session.index > 0) { session.index--; renderBrowse(); } });
  document.getElementById('nextBtn').addEventListener('click', () => {
    // 浏览完最后一个单词后不再自动跳测验，先进入过渡页（间隔），由用户点击后才开始测验
    if (last) showTransition();
    else { session.index++; renderBrowse(); }
  });

  clearTimeout(session._t);
  savePending(session); // 记录当前浏览位置，中途退出可继续
}

// 学习与测验之间的过渡页（间隔）：浏览完全部单词后展示，点击"开始测验"才进入测验
function showTransition() {
  if (!session) return;
  session.phase = 'transition';
  clearTimeout(session._t);
  const list = RAW_WORDS[session.listIndex];
  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="card big-card" style="text-align:center;padding:48px 24px">' +
      '<div style="font-size:56px">🎓</div>' +
      '<h2 style="margin-top:16px">List ' + (session.listIndex + 1) + ' 学习完成</h2>' +
      '<p class="sub" style="margin-top:8px">共 ' + list.words.length + ' 个单词已浏览完，<br>接下来进入测验检验学习成果</p>' +
      '<p class="hint" style="margin-top:12px">测验会随机打乱顺序 · 测完还有纯英文回忆轮</p>' +
    '</div>' +
    '<button class="btn primary" id="startQuizBtn">开始测验</button>';
  document.getElementById('startQuizBtn').addEventListener('click', startQuiz);
  savePending(session);
}

function startQuiz() {
  if (!session) return;
  session.phase = 'quiz';
  session.qIndex = 0;
  session.correctCount = 0;
  session.history = [];
  // 乱序：每次开始测验都重新打乱，重新测试顺序也会不一样
  session.queue = shuffle(session.queue);
  session.qOrder = session.queue.map(it => it.w.word);
  savePending(session);
  renderQuiz();
}

function pickDistractors(wordStr, n) {
  const pool = shuffle(ALL_WORDS.filter(w => w.word !== wordStr));
  const seen = new Set(); const out = [];
  for (const w of pool) {
    if (out.length >= n) break;
    if (!seen.has(w.meaning)) { seen.add(w.meaning); out.push(w.meaning); }
  }
  return out;
}

async function renderQuiz() {
  if (!session || session.phase !== 'quiz') return;
  clearTimeout(session._t); // 清除上次的自动跳题定时器
  const item = session.queue[session.qIndex];
  const total = session.queue.length;
  const correct = item.w.meaning;
  const answered = !!item.answered;
  const unfamNow = await isUnfamiliar(item.w.word);
  const options = shuffle([correct].concat(pickDistractors(item.w.word, 3)));
  const canPrev = session.history && session.history.length > 0;
  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="progress-row"><span>测验 ' + (session.qIndex + 1) + ' / ' + total + '</span>' +
      '<div class="bar"><div style="width:' + ((session.qIndex + 1) / total * 100).toFixed(1) + '%"></div></div></div>' +
    '<div class="quiz-head">' +
      '<button class="star-btn" id="quizStarBtn">' + (item.prog.favorite ? '⭐' : '☆') + '</button>' +
      '<div class="word-big" id="quizWord">' + esc(item.w.word) + '</div>' +
      (item.w.phonetic ? '<div class="phonetic">' + esc(item.w.phonetic) + '</div>' : '') +
      '<button class="unfam-pill' + (unfamNow ? ' on' : '') + '" id="quizUnfamBtn">' + (unfamNow ? '✓ 已标记' : '不熟悉') + '</button>' +
    '</div>' +
    '<div class="options">' +
      options.map(o => '<button class="opt" data-o="' + esc(o) + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>').join('') +
    '</div>' +
    '<div class="row2" style="margin-top:14px">' +
      '<button class="btn ghost" id="quizPrevBtn"' + (canPrev ? '' : ' disabled') + '>上一题</button>' +
      '<button class="btn primary" id="quizNextBtn"' + (answered ? '' : ' disabled') + '>下一题</button>' +
    '</div>';
  speak(item.w.word);
  // 点单词可重新朗读
  document.getElementById('quizWord').addEventListener('click', () => speak(item.w.word));
  document.getElementById('quizStarBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    item.prog.favorite = !item.prog.favorite;
    document.getElementById('quizStarBtn').textContent = item.prog.favorite ? '⭐' : '☆';
    item.prog.updatedAt = Date.now();
    await put('progress', item.prog);
    if (!item.prog.favorite) await removeUnfamiliar(item.w.word); // 取消收藏 → 同步移出"不熟悉"池
    toast(item.prog.favorite ? '已收藏 ⭐' : '已取消收藏');
  });
  // 不熟悉：可标记 / 取消。标记=加入次日复习+自动收藏；取消=移出池并同步移出收藏
  document.getElementById('quizUnfamBtn').addEventListener('click', async () => {
    const btn = document.getElementById('quizUnfamBtn');
    if (await isUnfamiliar(item.w.word)) {
      await removeUnfamiliar(item.w.word);
      if (item.prog.favorite) { item.prog.favorite = false; item.prog.updatedAt = Date.now(); await put('progress', item.prog); }
      btn.textContent = '不熟悉'; btn.classList.remove('on');
      toast('已取消标记，并移出收藏');
    } else {
      await addUnfamiliar(item.w.word);
      if (!item.prog.favorite) { item.prog.favorite = true; item.prog.updatedAt = Date.now(); await put('progress', item.prog); }
      btn.textContent = '✓ 已标记'; btn.classList.add('on');
      toast('已标记不熟悉，明天复习并已收藏 ⭐');
    }
  });

  const btns = body.querySelectorAll('.opt');
  if (!answered) {
    btns.forEach(b => b.addEventListener('click', async () => {
      if (item.answered) return;
      item.answered = true;
      const isCorrect = b.dataset.o === correct;
      if (isCorrect) {
        b.classList.add('right');
        session.correctCount++;
        item.quizCorrect = true;
      } else {
        b.classList.add('wrong');
        btns.forEach(x => { if (x.dataset.o === correct) x.classList.add('right'); });
        await autoFavoriteWord(item); // 选错 → 自动加入收藏夹
      }
      item.chosenWrong = isCorrect ? null : b.dataset.o;
      btns.forEach(x => x.disabled = true);
      document.getElementById('quizNextBtn').disabled = false;
      savePending(session); // 记录本次作答，中途退出后测验也能接续
      if (isCorrect) {
        // 选对意思：短暂展示绿色反馈后自动进入下一题（选错仍停留，看清正确答案再点下一题）
        clearTimeout(session._t);
        session._t = setTimeout(quizNext, 700);
      }
    }));
  } else {
    // 回看已答题目：标出正确/错误答案，禁止再作答
    btns.forEach(b => {
      if (b.dataset.o === correct) b.classList.add('right');
      else if (b.dataset.o === item.chosenWrong) b.classList.add('wrong');
    });
  }
  document.getElementById('quizPrevBtn').addEventListener('click', quizPrev);
  document.getElementById('quizNextBtn').addEventListener('click', quizNext);
  savePending(session); // 记录当前测验位置
}

/* 测验导航：上一题 / 下一题（用历史栈记录去过哪里） */
function quizPrev() {
  if (session) clearTimeout(session._t);
  if (!session || !session.history || !session.history.length) { toast('已是第一题'); return; }
  session.qIndex = session.history.pop();
  savePending(session);
  renderQuiz();
}
function quizNext() {
  if (session) clearTimeout(session._t);
  if (!session) return;
  session.history.push(session.qIndex);
  if (session.qIndex < session.queue.length - 1) {
    session.qIndex++;
  } else {
    // 最后一题答完 → 自动进入纯英文回忆轮
    startRecall();
    return;
  }
  savePending(session);
  renderQuiz();
}

/* ===== 回忆轮：测完 List 后自动再弹出，只显示英文、点卡片可重读，可标记"不熟悉" ===== */
function startRecall() {
  if (!session) return;
  session.phase = 'recall';
  session.rIndex = 0;
  session.recallHistory = [];
  // 乱序：重新打乱，每次测试顺序都不一样
  session.recallQueue = shuffle(session.queue.map(it => it.w));
  session.recallOrder = session.recallQueue.map(w => w.word);
  savePending(session);
  showSession(); // 更新标题为"回忆"
  renderRecall();
}
async function renderRecall() {
  if (!session || session.phase !== 'recall') return;
  const words = session.recallQueue;
  if (!words.length) { finishNew(); return; }
  const total = words.length;
  const w = words[session.rIndex];
  const canPrev = session.recallHistory && session.recallHistory.length > 0;
  const unfamNow = await isUnfamiliar(w.word);
  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="progress-row"><span>回忆 ' + (session.rIndex + 1) + ' / ' + total + '</span>' +
      '<div class="bar"><div style="width:' + ((session.rIndex + 1) / total * 100).toFixed(1) + '%"></div></div></div>' +
    '<div class="card big-card" id="recallCard">' +
      '<div class="word-big" id="recallWord">' + esc(w.word) + '</div>' +
      (w.phonetic ? '<div class="phonetic">' + esc(w.phonetic) + '</div>' : '') +
    '</div>' +
    '<button class="unfam-pill' + (unfamNow ? ' on' : '') + '" id="recallUnfamBtn">' + (unfamNow ? '✓ 已标记' : '不熟悉') + '</button>' +
    '<p class="hint">回想这个词的意思后点下一个 · 点卡片可重新朗读</p>' +
    '<div class="row2" style="margin-top:14px">' +
      '<button class="btn ghost" id="recallPrevBtn"' + (canPrev ? '' : ' disabled') + '>上一个</button>' +
      '<button class="btn primary" id="recallNextBtn">' + (session.rIndex === total - 1 ? '完成' : '下一个') + '</button>' +
    '</div>';
  speak(w.word);
  document.getElementById('recallCard').addEventListener('click', () => speak(w.word));
  document.getElementById('recallWord').addEventListener('click', () => speak(w.word));
  document.getElementById('recallPrevBtn').addEventListener('click', recallPrev);
  document.getElementById('recallNextBtn').addEventListener('click', recallNext);
  // 回忆轮也能标记 / 取消"不熟悉"：标记=加入次日复习+自动收藏；取消=移出池并同步移出收藏
  document.getElementById('recallUnfamBtn').addEventListener('click', async () => {
    const btn = document.getElementById('recallUnfamBtn');
    if (await isUnfamiliar(w.word)) {
      await removeUnfamiliar(w.word);
      const prog = await getOrCreateProgress(w);
      if (prog.favorite) { prog.favorite = false; prog.updatedAt = Date.now(); await put('progress', prog); }
      btn.textContent = '不熟悉'; btn.classList.remove('on');
      toast('已取消标记，并移出收藏');
    } else {
      await addUnfamiliar(w.word);
      // 回忆轮也要保证有进度记录，否则收藏写不进去
      const prog = await getOrCreateProgress(w);
      if (!prog.favorite) { prog.favorite = true; prog.updatedAt = Date.now(); await put('progress', prog); }
      btn.textContent = '✓ 已标记'; btn.classList.add('on');
      toast('已标记不熟悉，明天复习并已收藏 ⭐');
    }
  });
  savePending(session);
}
function recallPrev() {
  if (!session || !session.recallHistory || !session.recallHistory.length) { toast('已是第一个'); return; }
  session.rIndex = session.recallHistory.pop();
  savePending(session);
  renderRecall();
}
function recallNext() {
  if (!session) return;
  session.recallHistory.push(session.rIndex);
  if (session.rIndex < session.recallQueue.length - 1) {
    session.rIndex++;
  } else {
    finishNew(); // 回忆轮结束 → 出成绩
    return;
  }
  savePending(session);
  renderRecall();
}

// 测验选错意思 → 自动把该单词加入收藏夹（重复错 / 已收藏则不重复提示）
async function autoFavoriteWord(item) {
  if (!item || !item.prog || item.prog.favorite) return;
  item.prog.favorite = true;
  item.prog.updatedAt = Date.now();
  await put('progress', item.prog);
  toast('已自动收藏 ⭐');
}

async function finishNew() {
  if (!session) return;
  session.phase = 'result';
  const total = session.queue.length;
  const correct = session.correctCount;
  const rate = correct / total;
  const pass = rate >= NEW_PASS_RATE;
  const isReplay = session.mode === 'replay';
  const today = todayISO();
  const tomorrow = addDaysISO(today, 1);
  const missed = session.queue.filter(it => !it.quizCorrect).map(it => ({ word: it.w.word, meaning: it.w.meaning }));

  if (!isReplay) {
    // 正式学习才写进度；"重新学习 / 重新测试"仅练习，不改进度
    for (const it of session.queue) {
      const p = it.prog;
      p.reviews = p.reviews || [];
      p.reviews.push({ date: today, d: 0, correct: it.quizCorrect });
      if (p.reviews.length > 300) p.reviews = p.reviews.slice(-300);
      if (pass) { p.stage = 1; p.nextReviewDate = tomorrow; p.learnedDate = today; }
      else { p.stage = 0; p.nextReviewDate = tomorrow; }   // <70% 保持 stage=0，明天重学
      p.updatedAt = Date.now();
      await put('progress', p);
    }
    if (pass) await setSetting('learnedIndex', session.listIndex + 1);
    await recordDailyStats(total, 0, correct, total);
    await clearPending(); // 本 List 已学完，清除"继续学习"的残留进度
    autoSync(); // 背完本 List 后自动同步到云端（手机/电脑进度保持一致）
  }

  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="result-card card">' +
      '<div class="big-emoji">' + (isReplay ? '🎯' : (pass ? '🎉' : '💪')) + '</div>' +
      '<h2>' + (isReplay ? 'List ' + (session.listIndex + 1) + ' 练习完成！' : (pass ? 'List ' + (session.listIndex + 1) + ' 完成！' : '再接再厉')) + '</h2>' +
      '<p class="rate">正确率 ' + Math.round(rate * 100) + '%</p>' +
      '<p class="sub">' + correct + '/' + total + ' 题 · ' + (isReplay ? '本次为练习，不影响学习进度' : (pass ? '已晋级 stage 1，明天开始第一次复习' : '未达 70%，明天重学本 List')) + '</p>' +
      (missed.length ? '<div class="missed"><div class="missed-title">' + (pass ? '答错的词巩固一下' : '本 List 单词') + '</div>' +
        missed.map(m => '<div class="missed-item"><b>' + esc(m.word) + '</b><span>' + esc(m.meaning) + '</span></div>').join('') + '</div>' : '') +
    '</div>' +
    '<button class="btn primary" id="doneBtn">返回首页</button>';
  document.getElementById('doneBtn').addEventListener('click', closeSession);
}

/* =====================================================================
   复习旧词（stage>=1）：认识 / 不认识
   ===================================================================== */
async function startReviewSession() {
  const queue = await getReviewQueue();
  if (!queue.length) { toast('今日没有待复习的单词'); return; }

  // 当天有未完成复习 → 接着复习，而不是从头再来
  const pending = await loadPendingReview();
  if (pending && pending.order && pending.order.length) {
    const progMap = {}; queue.forEach(it => { progMap[it.prog.word] = it; });
    const items = [];
    pending.order.forEach(word => {
      const it = progMap[word];
      if (!it) return; // 该词已不在今日待复习队列（异常情况），跳过
      const a = pending.answers[word];
      items.push({ prog: it.prog, extra: it.extra, answered: a === 'y' ? true : (a === 'n' ? false : null) });
    });
    queue.forEach(it => { if (!pending.order.includes(it.prog.word)) items.push({ prog: it.prog, extra: it.extra, answered: null }); });
    if (items.length) {
      let index = Math.min(pending.index || 0, items.length - 1);
      while (index < items.length && items[index].answered !== null) index++; // 跳过已答过的词
      session = {
        mode: 'review', queue: items, index: index,
        correctCount: pending.correctCount || 0, wrongCount: pending.wrongCount || 0,
        phase: 'card', history: []
      };
      showSession();
      if (index >= items.length) { finishReview(); return; } // 全部已答完，直接出结果
      renderReview();
      return;
    }
  }
  if (pending) await clearPendingReview(); // 旧日 / 无效残留进度，丢弃

  session = {
    mode: 'review',
    queue: queue.map(it => ({ prog: it.prog, extra: it.extra, answered: null })),
    index: 0, correctCount: 0, wrongCount: 0,
    phase: 'card', history: []
  };
  showSession();
  renderReview();
}

/* 复习完成后：把同一批单词再走一遍（练习模式，不写进度） */
function startReviewReplay(prevQueue) {
  if (!prevQueue || !prevQueue.length) return;
  session = {
    mode: 'review-replay',
    queue: prevQueue.map(it => ({ prog: it.prog, extra: it.extra, answered: null })),
    index: 0, correctCount: 0, wrongCount: 0,
    phase: 'card', history: []
  };
  showSession();
  renderReview();
}

/* 首页"今日复习已完成"卡片：按存档单词重建队列，再复习一遍（练习模式，不写进度） */
async function startReviewReplayFromResult(res) {
  if (!res || !res.words || !res.words.length) { toast('今天还没有复习记录'); return; }
  const queue = [];
  for (const it of res.words) {
    const w = WORD_MAP[it.word];
    let p = await get('progress', it.word);
    if (!p && w) p = buildProgress(w);
    if (!p) continue;
    queue.push({ prog: p, extra: !!it.extra, answered: null });
  }
  if (!queue.length) { toast('没有可复习的单词'); return; }
  startReviewReplay(queue);
}

/* =====================================================================
   当天练习：List 已完成后再"重新学习"或"重新测试"（不影响学习进度）
   startPhase: 'browse' 重新学习（先浏览再测验） / 'quiz' 直接测验
   ===================================================================== */
async function startReplay(listIndex, startPhase) {
  const list = RAW_WORDS[listIndex];
  if (!list) return;
  const queue = [];
  for (const w of list.words) {
    const prog = await getOrCreateProgress(w);
    queue.push({ w: w, prog: prog, quizCorrect: false, answered: false });
  }
  session = { mode: 'replay', listIndex: listIndex, queue: queue, index: 0, qIndex: 0, correctCount: 0, phase: startPhase };
  showSession();
  if (startPhase === 'quiz') startQuiz(); else renderBrowse();
}

function renderReview() {
  if (!session) return;
  const item = session.queue[session.index];
  const w = WORD_MAP[item.prog.word];
  if (!w) { nextWord(); return; }
  const total = session.queue.length;
  const revealed = item.answered === true || item.answered === false; // 已作答 → 显示释义
  const canPrev = session.history && session.history.length > 0;
  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="progress-row"><span>复习 ' + (session.index + 1) + ' / ' + total + '</span>' +
      '<div class="bar"><div style="width:' + ((session.index + 1) / total * 100).toFixed(1) + '%"></div></div></div>' +
    '<div class="card big-card" id="scard">' +
      '<button class="star-btn" id="starBtn">' + (item.prog.favorite ? '⭐' : '☆') + '</button>' +
      '<div class="word-big">' + esc(w.word) + '</div>' +
      (w.phonetic ? '<div class="phonetic">' + esc(w.phonetic) + '</div>' : '') +
      (item.extra ? '<p class="hint" style="margin-top:8px;color:#007AFF;font-weight:600">不熟悉词 · 认识后自动移出</p>' : '') +
      (revealed ? '<div class="meaning">' + esc(w.meaning) + '</div>' + exHTML(w.word) : '') +
    '</div>' +
    (revealed
      ? '<div class="row2" style="margin-top:14px"><button class="btn ghost" id="prevBtn"' + (canPrev ? '' : ' disabled') + '>上一个</button><button class="btn primary" id="nextBtn">下一词</button></div>'
      : '<div class="row2"><button class="btn ghost" id="prevBtn"' + (canPrev ? '' : ' disabled') + '>上一个</button><button class="btn yes" id="knowBtn">认识 ✓</button></div>' +
        '<button class="btn no" id="noBtn" style="margin-top:12px">不认识 ✗</button>') +
    '<p class="hint">' + (revealed ? '' : '点击卡片可重新朗读') + '</p>';
  speak(w.word);

  document.getElementById('starBtn').addEventListener('click', async (e) => {
    e.stopPropagation();
    item.prog.favorite = !item.prog.favorite;
    document.getElementById('starBtn').textContent = item.prog.favorite ? '⭐' : '☆';
    item.prog.updatedAt = Date.now();
    await put('progress', item.prog);
    if (!item.prog.favorite) await removeUnfamiliar(item.prog.word); // 取消收藏 → 同步移出"不熟悉"池
    toast(item.prog.favorite ? '已收藏 ⭐' : '已取消收藏');
  });
  document.getElementById('scard').addEventListener('click', () => speak(w.word));
  document.getElementById('prevBtn').addEventListener('click', prevReviewWord);

  clearTimeout(session._t);
  if (revealed) {
    document.getElementById('nextBtn').addEventListener('click', nextWord);
  } else {
    document.getElementById('knowBtn').addEventListener('click', () => { item.answered = true; session.correctCount++; savePendingReview(session); nextWord(); });
    document.getElementById('noBtn').addEventListener('click', () => { item.answered = false; session.wrongCount++; savePendingReview(session); renderReview(); });
  }
  savePendingReview(session); // 记录复习进度，中途退出可继续
}

function prevReviewWord() {
  clearTimeout(session._t);
  if (!session || !session.history || !session.history.length) { toast('已是第一个'); return; }
  session.index = session.history.pop();
  savePendingReview(session);
  renderReview();
}

function nextWord() {
  clearTimeout(session._t);
  if (!session) return;
  session.history = session.history || [];
  session.history.push(session.index);
  session.index++;
  if (session.index >= session.queue.length) finishReview();
  else { savePendingReview(session); renderReview(); }
}

async function finishReview() {
  if (!session) return;
  session.phase = 'result';
  const total = session.queue.length;
  const correct = session.correctCount;
  const rate = correct / total;
  const pass = rate >= REVIEW_PASS_RATE;
  const today = todayISO();
  const tomorrow = addDaysISO(today, 1);
  const missed = session.queue.filter(it => it.answered === false).map(it => {
    const w = WORD_MAP[it.prog.word]; return { word: w.word, meaning: w.meaning };
  });
  const isReplayReview = session.mode === 'review-replay';

  if (!isReplayReview) {
    for (const it of session.queue) {
      const p = it.prog;
      const w = WORD_MAP[p.word];
      // "不熟悉"词：只更新不熟悉池（认识 → 移出；不认识 → 保留，明日继续复习），不动学习进度
      if (it.extra) {
        if (it.answered === true && await removeUnfamiliar(p.word) && p.favorite) {
          p.favorite = false; p.updatedAt = Date.now(); // 认识后同步移出收藏，保持"不熟悉=收藏"一致
          await put('progress', p);
        }
        continue;
      }
      const lastExp = p.lastReviewDate || p.learnedDate;
      const d = lastExp ? daysBetween(lastExp, today) : 0;
      p.reviews = p.reviews || [];
      p.reviews.push({ date: today, d: d, correct: it.answered === true });
      if (p.reviews.length > 300) p.reviews = p.reviews.slice(-300);
      p.lastReviewDate = today;
      if (it.answered === true) p.rightCount++; else p.wrongCount++;
      if (pass) {
        if (p.stage < 6) {
          const cur = p.stage;
          p.stage = cur + 1;
          p.nextReviewDate = (p.stage >= 6) ? null : addDaysISO(today, INTERVALS[p.stage]); // 用晋级后的新 stage 查间隔
        }
      } else {
        p.nextReviewDate = tomorrow; // <80% 不晋级，强制明天再复习
      }
      // 认识后若仍在"不熟悉"池，一并清除并同步移出收藏（可能之前标记过）
      if (it.answered === true && await removeUnfamiliar(p.word) && p.favorite) {
        p.favorite = false; // 保持"不熟悉=收藏"一致
      }
      p.updatedAt = Date.now();
      await put('progress', p);
    }
    await recordDailyStats(0, total, correct, total);
    // 存档本次结果：首页"今日复习已完成"卡片可反复点开查看这些不熟悉单词、也可再复习一遍
    await saveLastReviewResult({
      date: today, total: total, correct: correct, pass: pass, missed: missed,
      words: session.queue.map(it => ({ word: it.prog.word, extra: !!it.extra }))
    });
  }

  const body = document.getElementById('sessionBody');
  body.innerHTML =
    '<div class="result-card card">' +
      '<div class="big-emoji">' + (pass ? '🌟' : '📖') + '</div>' +
      '<h2>' + (pass ? '复习通过，全部晋级' : '未达标') + '</h2>' +
      '<p class="rate">正确率 ' + Math.round(rate * 100) + '%</p>' +
      '<p class="sub">' + correct + '/' + total + ' 词 · ' + (isReplayReview ? '巩固练习，不影响学习进度' : (pass ? '每词 stage +1，按新间隔排下次复习' : '低于 80%，明天强制再次复习')) + '</p>' +
      (missed.length ? '<div class="missed"><div class="missed-title">巩固一下</div>' +
        missed.map(m => '<div class="missed-item"><b>' + esc(m.word) + '</b><span>' + esc(m.meaning) + '</span></div>').join('') + '</div>' : '') +
    '</div>' +
    (isReplayReview ? '' : '<button class="btn ghost" id="replayReviewBtn">再复习一遍 ↻</button>') +
    '<button class="btn primary" id="doneBtn">返回首页</button>';
  if (!isReplayReview) {
    document.getElementById('replayReviewBtn').addEventListener('click', () => startReviewReplay(session.queue));
  }
  document.getElementById('doneBtn').addEventListener('click', closeSession);
  if (!isReplayReview) {
    await clearPendingReview(); // 复习完成，清除"继续复习"的残留进度
    autoSync(); // 复习完后自动同步到云端（手机/电脑进度保持一致）
  }
}

/* =====================================================================
   收藏页
   ===================================================================== */
async function renderFav() {

  const progs = (await getAll('progress')).filter(p => p.favorite);
  if (!progs.length) {
    el.innerHTML = '<div class="page-head"><h1>收藏</h1></div>' +

      '<div class="fav-group-head" data-list="' + l + '">' +
        '<b>List ' + l + '</b>' +
        '<span class="count-badge">' + items.length + ' 词</span>' +
        '<span class="fav-group-arrow">' + (open ? '▾' : '▸') + '</span>' +

      '<div class="fav-group-body"' + (open ? '' : ' style="display:none"') + '>' +

          return '<div class="fav-item">' +
            '<div class="fav-head">' +
              '<div><b class="word">' + esc(w.word) + '</b>' + (w.phonetic ? ' <span class="phonetic">' + esc(w.phonetic) + '</span>' : '') +
                '<span class="list-tag">List ' + l + '</span></div>' +
              '<button class="unfav" data-w="' + esc(w.word) + '">取消收藏</button>' +
            '</div>' +
            '<div class="meaning">' + esc(w.meaning) + '</div>' +
            exHTML(w.word) +
          '</div>';
        }).join('') +
      '</div>' +

    const p = await get('progress', b.dataset.w);
    if (p) { p.favorite = false; p.updatedAt = Date.now(); await put('progress', p); }
    await removeUnfamiliar(b.dataset.w); // 取消收藏 → 同步移出"不熟悉"池
    toast('已取消收藏');
    renderFav();
  }));
}

/* =====================================================================
   统计页：热力图 + 遗忘曲线
   ===================================================================== */
async function renderStats() {
  const el = document.getElementById('page-stats');
  const progs = await getAll('progress');
  const stats = await getAll('stats');
  const map = {}; stats.forEach(s => { map[s.date] = s.total || 0; });
  const wordList = {}; RAW_WORDS.forEach((lst, i) => lst.words.forEach(w => { wordList[w.word] = i + 1; }));
  const dateLists = {};
  progs.forEach(p => { if (p.learnedDate) { const l = wordList[p.word]; if (l) { (dateLists[p.learnedDate] = dateLists[p.learnedDate] || []).push(l); } } });
  const learned = progs.filter(p => p.stage >= 1).length;

function calcStreak(map) {
  const t = new Date();
  let streak = 0;
  if (!map[toISO(t)]) t.setDate(t.getDate() - 1);
  while (map[toISO(t)] > 0) { streak++; t.setDate(t.getDate() - 1); }
  return streak;
}

function calcCheckin(map) {
  const t = new Date();
  const prefix = t.getFullYear() + '-' + pad2(t.getMonth() + 1);
  let month = 0, total = 0;
  for (const iso in map) {
    if (map[iso] > 0) {
      total++;
      if (iso.slice(0, 7) === prefix) month++;
    }
  }
  return { month, total };
}

// 打卡日历当前浏览的月份（0 基），默认本月；可翻看历史月份 / 年份
let ckView = null;

function renderCheckinGrid(el, map, dateLists) {
  const box = el.querySelector('#checkinGrid');
  if (!box) return;
  const now = new Date();
  if (!ckView) ckView = { y: now.getFullYear(), m: now.getMonth() };
  const y = ckView.y, m = ckView.m;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一开始
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = todayISO();
  const week = ['一', '二', '三', '四', '五', '六', '日'];
  let html = '<div class="ck-week">' + week.map(d => '<span>' + d + '</span>').join('') + '</div><div class="ck-grid">';
  for (let i = 0; i < offset; i++) html += '<div class="ck-cell ck-empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = y + '-' + pad2(m + 1) + '-' + pad2(d);
    const n = map[iso] || 0;
    const future = iso > today;
    let cls = 'ck-cell';
    if (future) cls += ' ck-future';
    else if (n > 0) cls += ' ck-on';
    if (iso === today) cls += ' ck-today';
    const lists = (dateLists && dateLists[iso]) ? [...new Set(dateLists[iso])] : [];
    const tag = lists.length ? '<span class="ck-l">' + lists.map(x => 'L' + x).join(',') + '</span>' : '';
    html += '<div class="' + cls + '" title="' + iso + (lists.length ? ' 学 List ' + lists.join(',') : '') + (n ? ' · 打卡 ' + n + ' 词' : '') + '">' + d + tag + '</div>';
  }
  html += '</div>';
  box.innerHTML = html;

  // 月份标题
  const title = el.querySelector('#ckTitle');
  if (title) title.textContent = y + '年' + (m + 1) + '月';
  // 翻月导航（onclick 属性赋值，避免重复绑定叠加）
  const prev = el.querySelector('#ckPrev');
  const next = el.querySelector('#ckNext');
  const atCurrent = y === now.getFullYear() && m === now.getMonth();
  if (next) {
    next.disabled = atCurrent; // 本月不可再往后翻
    next.onclick = () => { ckView.m++; if (ckView.m > 11) { ckView.m = 0; ckView.y++; } renderCheckinGrid(el, map, dateLists); };
  }
  if (prev) prev.onclick = () => { ckView.m--; if (ckView.m < 0) { ckView.m = 11; ckView.y--; } renderCheckinGrid(el, map, dateLists); };
}

function heatColor(n, max) {
  if (n <= 0) return '#E9E9EB';
  const t = 0.15 + 0.85 * (n / max);
  return 'rgba(0,122,255,' + t.toFixed(2) + ')';
}

function renderHeatmap(el, map) {
  const box = el.querySelector('#heatmap');
  const today = new Date();
  const days = 90;
  let max = 1;
  for (const k in map) if (map[k] > max) max = map[k];
  let cells = '';
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    const iso = toISO(d);
    const n = map[iso] || 0;
    cells += '<div class="hm-cell" style="background:' + heatColor(n, max) + '" title="' + iso + '：学习 ' + n + ' 词"></div>';
  }
  box.innerHTML = cells;
}

async function drawCurve(el) {
  const canvas = el.querySelector('#curveCanvas');
  const progs = await getAll('progress');
  const wrap = canvas.parentElement;
  const W = wrap.clientWidth || 340, H = 240;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const padL = 36, padR = 12, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxD = 15;
  const X = d => padL + plotW * d / maxD;
  const Y = v => padT + plotH * (1 - v / 100);

  // 网格 + 坐标
  ctx.strokeStyle = '#E5E5EA'; ctx.lineWidth = 1;
  ctx.fillStyle = '#8E8E93'; ctx.font = '10px -apple-system, sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  [0, 25, 50, 75, 100].forEach(v => {
    ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(W - padR, Y(v)); ctx.stroke();
    ctx.fillText(v + '%', padL - 6, Y(v));
  });
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [0, 3, 6, 9, 12, 15].forEach(d => ctx.fillText(d + '天', X(d), H - padB + 6));

  // 理论艾宾浩斯曲线 R(t) = e^(-t/4)
  const theo = d => 100 * Math.exp(-d / 4);
  ctx.strokeStyle = '#C7C7CC'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let d = 0; d <= maxD; d += 0.25) {
    const x = X(d), y = Y(theo(d));
    if (d === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  // 实际保留率：按「距上次学习天数」分桶统计复习正确率
  const buckets = new Array(maxD + 1).fill(null);
  progs.forEach(p => (p.reviews || []).forEach(r => {
    const d = Math.min(maxD, Math.max(0, Math.round(r.d || 0)));
    if (!buckets[d]) buckets[d] = { c: 0, t: 0 };
    buckets[d].c += (r.correct ? 1 : 0); buckets[d].t++;
  }));
  const pts = [];
  for (let d = 0; d <= maxD; d++) {
    const b = buckets[d];
    if (b && b.t > 0) pts.push({ x: X(d), y: Y(b.c / b.t * 100) });
  }
  if (pts.length >= 2) {
    ctx.strokeStyle = '#007AFF'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
    ctx.stroke();
    ctx.fillStyle = '#007AFF';
    pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill(); });
  } else {
    ctx.fillStyle = '#C7C7CC'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '13px -apple-system, sans-serif';
    ctx.fillText('复习数据不足，坚持学习后这里会显示曲线', W / 2, H / 2);
  }
}

/* ---------- 云同步：双向合并，更新时间较新的为准 ---------- */
function parseResp(resp) {
  if (!resp.ok) return resp.json().then(j => { throw new Error(j.message || ('HTTP ' + resp.status)); });
  return resp.json();
}
function safeParse(s) { try { const v = JSON.parse(s); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function parseVal(v) { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return v; } } return v; }

function prRemote(p) {
  return {
    word: p.word, list: p.list, stage: p.stage,
    next_review_date: p.nextReviewDate,
    right_count: p.rightCount, wrong_count: p.wrongCount,
    last_review_date: p.lastReviewDate, learned_date: p.learnedDate,
    favorite: !!p.favorite, reviews: JSON.stringify(p.reviews || []),
    updated_at: p.updatedAt
  };
}
function prLocal(r) {
  return {
    word: r.word, list: r.list, stage: r.stage,
    nextReviewDate: r.next_review_date,
    rightCount: r.right_count, wrongCount: r.wrong_count,
    lastReviewDate: r.last_review_date, learnedDate: r.learned_date,
    favorite: !!r.favorite,
    reviews: typeof r.reviews === 'string' ? safeParse(r.reviews) : (Array.isArray(r.reviews) ? r.reviews : []),
    updatedAt: r.updated_at || 0
  };
}
function stRemote(s) {
  return { date: s.date, new_count: s.newCount, review_count: s.reviewCount, correct: s.correct, total: s.total, updated_at: s.updatedAt };
}
function stLocal(r) {
  return { date: r.date, newCount: r.new_count, reviewCount: r.review_count, correct: r.correct, total: r.total, updatedAt: r.updated_at || 0 };
}

async function syncNow(silent) {
  const el = document.getElementById('syncStatus');
  const url = ((await getSetting('supabaseUrl')) || '').trim();
  const key = ((await getSetting('supabaseKey')) || '').trim();
  if (!url || !key) { if (el) el.textContent = '请先填写并保存 Supabase URL 与 Anon Key'; if (!silent) toast('请先保存配置'); return; }
  if (el) el.textContent = '同步中…';
  const headers = { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };

  try {
    const [rp, rs, rset] = await Promise.all([
      fetch(url + '/rest/v1/progress?select=*', { headers: headers }).then(parseResp),
      fetch(url + '/rest/v1/stats?select=*', { headers: headers }).then(parseResp),
      fetch(url + '/rest/v1/settings?select=*', { headers: headers }).then(parseResp)
    ]);

    // 进度合并
    const pMap = {}; (await getAll('progress')).forEach(p => { pMap[p.word] = p; });
    const pushP = [];
    const remoteSeenP = new Set();
    (rp || []).forEach(remote => {
      remoteSeenP.add(remote.word);
      const l = pMap[remote.word];
      const ru = remote.updated_at || 0;
      if (!l) { pMap[remote.word] = prLocal(remote); pushP.push(remote); }
      else if (ru > (l.updatedAt || 0)) {
        // 云端更新：本地收藏过就不能被云端旧记录冲掉
        const merged = prLocal(remote);
        if (l.favorite && !merged.favorite) merged.favorite = true;
        pMap[remote.word] = merged;
        pushP.push(merged);
      }
      else if (ru < (l.updatedAt || 0)) {
        // 本地更新：云端收藏过就不能被本地旧记录冲掉
        const out = prRemote(l);
        if (remote.favorite && !out.favorite) out.favorite = true;
        pushP.push(out);
      }
    });
    // 补传本地有而云端没有的记录（换设备首次同步必须，否则本地数据会丢）
    for (const word in pMap) if (!remoteSeenP.has(word)) pushP.push(prRemote(pMap[word]));
    for (const word in pMap) await put('progress', pMap[word]);

    // 统计合并
    const sMap = {}; (await getAll('stats')).forEach(s => { sMap[s.date] = s; });
    const pushS = [];
    const remoteSeenS = new Set();
    (rs || []).forEach(remote => {
      remoteSeenS.add(remote.date);
      const l = sMap[remote.date];
      const ru = remote.updated_at || 0;
      if (!l) { sMap[remote.date] = stLocal(remote); pushS.push(remote); }
      else if (ru > (l.updatedAt || 0)) { sMap[remote.date] = stLocal(remote); pushS.push(remote); }
      else if (ru < (l.updatedAt || 0)) { pushS.push(stRemote(l)); }
    });
    // 补传本地有而云端没有的统计记录
    for (const date in sMap) if (!remoteSeenS.has(date)) pushS.push(stRemote(sMap[date]));
    for (const date in sMap) await put('stats', sMap[date]);

    // 设置合并（learnedIndex）
    const idxRec = await get('settings', 'learnedIndex');
    const li = (idxRec && idxRec.value != null) ? idxRec.value : 0;
    const remoteIdx = (rset || []).find(s => s.key === 'learnedIndex');
    let merged = li;
    if (remoteIdx && (remoteIdx.updated_at || 0) > (idxRec ? (idxRec.updatedAt || 0) : 0)) merged = parseVal(remoteIdx.value);
    await setSetting('learnedIndex', merged);
    const pushSet = [{ key: 'learnedIndex', value: String(merged), updated_at: Date.now() }];

    // 推送（upsert）
    if (pushP.length) await fetch(url + '/rest/v1/progress', {
      method: 'POST', headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(pushP)
    });
    if (pushS.length) await fetch(url + '/rest/v1/stats', {
      method: 'POST', headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(pushS)
    });
    if (pushSet.length) await fetch(url + '/rest/v1/settings', {
      method: 'POST', headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates,return=minimal' }), body: JSON.stringify(pushSet)
    });

    await setSetting('lastSyncAt', Date.now());
    if (el) el.textContent = '同步完成 ✅ ' + new Date().toLocaleTimeString();
    if (!silent) toast('云同步完成');
    refreshAll();
  } catch (e) {
    if (el) el.textContent = '同步失败：' + e.message;
    if (!silent) toast('同步失败');
  }
}

// 清理残留的脏进度数据，避免统计 / 日历 / 复习被污染：
//  1) 单词已不在词库（孤儿记录）
//  2) 单词所在 List 比当前学习进度靠后太多 —— 本 App 只能顺序学，后面的 List 不该有进度，
//     出现即说明是测试 / 残留脏数据（例如某天日历突然多出个没学过的 List 编号）
async function cleanupOrphanProgress() {
  const progs = await getAll('progress');
  const learnedIdx = await computeLearnedIndex(); // 0 基：第一个尚有未学单词的 List
  for (const p of progs) {
    if (!WORD_MAP[p.word]) { await del('progress', p.word); continue; }
    const li = WORD_MAP[p.word].list; // 1 基 List 编号
    // 只清理"靠后 List 里、且没有任何真实数据"的残留脏数据；
    // 用户收藏过 / 有学习进度的记录必须保留（否则会误删收藏的单词）
    const hasRealData = p.favorite || p.stage >= 1 || p.learnedDate ||
      (p.reviews && p.reviews.length) || p.rightCount > 0 || p.wrongCount > 0 || p.nextReviewDate;
    if (li && li > learnedIdx + 1 && !hasRealData) await del('progress', p.word);
  }
}

// 修复历史遗留：旧版在 List 总览点"不熟悉"时，若该词还没有学习进度记录，
// 只会标记进次日复习、写不进收藏。启动时把这类"已标记但未收藏"的词统一补进收藏。
async function repairUnfamiliarFavorites() {
  const l = await getUnfamiliar();
  let changed = 0;
  for (const u of l) {
    const wordObj = WORD_MAP[u.w];
    if (!wordObj) continue;
    const p = await getOrCreateProgress(wordObj);
    if (!p.favorite) { p.favorite = true; p.updatedAt = Date.now(); await put('progress', p); changed++; }
  }
  if (changed > 0) {
    refreshAll();
    toast('已把 ' + changed + ' 个不熟悉的单词补进收藏 ⭐');
  }
}

async function init() {
  try { await openDB(); }
  catch (e) { alert('无法打开本地数据库：' + e.message); return; }
  await cleanupOrphanProgress();
  bindTabs();
  await renderStudy();
  renderLists();
  renderFav();
  renderStats();
  renderMine();
  await repairUnfamiliarFavorites(); // 补上历史遗漏的不熟悉词收藏（在首次云同步前执行）
  // 自动云同步：打开 App 后静默拉取云端最新进度；此后每 60 秒静默同步一次，
  // 手机 / 电脑任一端背完都会自动同步到另一端，无需手动点"立即同步"。
  setTimeout(() => { if (!document.hidden) autoSync(true); }, 2000);
  setInterval(() => { if (!document.hidden) autoSync(true); }, 60000);
}
init();
</script>
</body>
</html>
